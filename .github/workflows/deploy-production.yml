name: Deploy frontend to production

# Runs when a release tag starting with "prod-" is pushed (e.g. by publishing a GitHub Release
# with tag prod-1.0.0). Lints and type-checks first, then builds the Docker image here on GitHub
# and pushes it to GitHub Container Registry; the server only downloads and runs it.
on:
  push:
    tags: ["prod-*"]

concurrency:
  group: production-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint src --max-warnings 0
      - name: Type-check
        run: npx tsc --noEmit -p .

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bengali-lkc-frontend" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The free Azure server (B2ats_v2) is x86-64. Set the repo variable IMAGE_PLATFORMS to
          # "linux/arm64" for an ARM server.
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Deploy ${{ github.ref_name }} on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$HOST" "frontend ${GITHUB_REF_NAME}"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bengali-lkc:latest
    container_name: bengali-lkc
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # University server deployments typically sit behind a reverse proxy
    # (nginx/Apache) that terminates TLS — HTTPS is mandatory per SRS §12.3.
